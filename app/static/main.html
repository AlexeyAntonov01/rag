<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG - Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
 
        body {
            background-color: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh; 
            display: flex;
            flex-direction: column;
            background-color: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background-color: #f9fbfd;
        }
        
        .message {
            display: flex;
            margin-bottom: 1.5rem;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .bubble {
            max-width: 75%;
            padding: 0.75rem 1.25rem;
            border-radius: 1.25rem;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            word-break: break-word;
        }
        
        .user .bubble {
            background-color: #0d6efd;
            color: white;
            border-bottom-right-radius: 0.25rem;
        }
        
        .bot .bubble {
            background-color: #f0f2f5;
            border-bottom-left-radius: 0.25rem;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.75rem;
            background-color: #e9ecef;
            color: #495057;
            flex-shrink: 0;
        }
        
        .user .avatar {
            margin-left: 0.75rem;
            margin-right: 0;
            background-color: #0d6efd;
            color: white;
        }
        
        .input-area {
            background-color: white;
            border-top: 1px solid #e9ecef;
            padding: 1rem 1.5rem 1.5rem;
        }
        
        textarea.form-control {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            resize: none;
        }
        
        textarea.form-control:focus {
            background-color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
            border-color: #86b7fe;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin {
            display: inline-block;
            animation: spin 1s linear infinite;
            color: #0d6efd;
        }
        .typing-indicator {
            font-style: italic;
            color: #6c757d !important;
            background-color: #f8f9fa !important;
        }
    </style>

</head>
<body>
    <div class="chat-container">
        <div class="bg-white py-3 px-4 border-bottom">
            <div class="d-flex align-items-center">
                <i class="bi bi-chat-dots-fill text-primary fs-4 me-2"></i>
                <h5 class="mb-0 fw-semibold">RAG ассистент</h5>
            </div>
        </div>

        <div class="messages-area" id="messagesArea">
        </div>

        <div class="input-area">
            <div class="d-flex gap-2">
                <textarea class="form-control rounded-4" 
                    id="messageInput" 
                    rows="1" 
                    placeholder="Введите сообщение..."></textarea>
                <button class="btn btn-primary rounded-4 px-4" id="sendButton" >
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
            <div class="small text-secondary mt-2 text-center text-md-start">
                <i class="bi bi-database me-1"></i>RAG система · поиск по документам
            </div>
        </div>

        <script>

        const messagesDiv = document.getElementById('messagesArea');
        const inputField = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        
        const API_URL = '/ask';

        function addMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `d-flex ${isUser ? 'justify-content-end' : 'justify-content-start'} mb-3`;
            
            const bubble = document.createElement('div');
            bubble.className = `p-2 rounded-3 ${isUser ? 'bg-primary text-white' : 'bg-light'}`;
            bubble.style.maxWidth = '80%';
            bubble.style.whiteSpace = 'pre-wrap'; 
            bubble.textContent = text;
            
            msgDiv.appendChild(bubble);
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            addMessage(text, true);
            inputField.value = '';

            inputField.disabled = true;
            sendButton.disabled = true;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'bubble bot-msg typing-indicator';
            loadingDiv.innerHTML = '<i class="bi bi-cpu-fill spin"></i> Ищу в документах...';
            messagesDiv.appendChild(loadingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                loadingDiv.remove();
                addMessage(data.answer || 'Ошибка формата ответа', false);
            } catch (error) {
                addMessage('Ошибка подключения к серверу', false);
                console.error(error);
            }
            finally{
                inputField.disabled = false;
                sendButton.disabled = false;
            }
        }

        sendButton.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        </script>
    </div>
</body>
</html>
