version: '3.8'

services:
  qdrant_db:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
       - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage 
    networks:
      - rag-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rag_app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - QDRANT_HOST=qdrant_db      
      - HF_ENDPOINT=https://hf-mirror.com
      - OLLAMA_HOST=http://docker.internal
      - HF_HOME=/root/.cache/huggingface 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./data:/app/data           
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant_db
    networks:
      - rag-network
    restart: unless-stopped

  tg_bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: tg_bot
    command: ["python", "bot/main.py"]
    environment:
      - API_HOST=http://app:8000 
    env_file:
      - .env
    depends_on:
      - app 
    networks:
      - rag-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/output_images:/usr/share/nginx/html/output_images:ro
      - ./app/static:/usr/share/nginx/html/static:ro
    depends_on:
      - app
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  hf_cache: 
